<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="app_icon.png">
    <title>training-log - サポートページ</title>
    <meta name="description" content="仲間とゆるく続ける筋トレログ「training-log」のサポートページ。利用規約・プライバシーポリシー・お問い合わせはこちら。">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --ink: #1d1d1f;
            --muted: #86868b;
            --line: #e5e5ea;
            --arrow: #c7c7cc;
            --icon-orange: #fdeee6;
            --icon-blue: #e8f0fe;
            --icon-green: #e6f4ea;
            --icon-purple: #f3e8fd;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-hover: 0 4px 12px rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #161618;
                --card: #232326;
                --ink: #f5f5f7;
                --muted: #98989e;
                --line: #313135;
                --arrow: #5a5a60;
                --icon-orange: #3a2a22;
                --icon-blue: #22303f;
                --icon-green: #22352a;
                --icon-purple: #322640;
                --shadow: 0 1px 3px rgba(0,0,0,0.4);
                --shadow-hover: 0 4px 12px rgba(0,0,0,0.5);
            }
        }
        :root[data-theme="dark"] {
            --bg: #161618;
            --card: #232326;
            --ink: #f5f5f7;
            --muted: #98989e;
            --line: #313135;
            --arrow: #5a5a60;
            --icon-orange: #3a2a22;
            --icon-blue: #22303f;
            --icon-green: #22352a;
            --icon-purple: #322640;
            --shadow: 0 1px 3px rgba(0,0,0,0.4);
            --shadow-hover: 0 4px 12px rgba(0,0,0,0.5);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            text-align: center;
            padding: 60px 20px 20px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 15px;
            color: var(--muted);
            margin-top: 6px;
        }
        .hero {
            text-align: center;
            padding: 40px 20px 32px;
        }
        .hero-icon {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        .hero-icon img {
            width: 100%;
            height: 100%;
            border-radius: 22px;
            display: block;
        }
        .hero h2 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }
        .hero p {
            font-size: 15px;
            color: var(--muted);
            max-width: 360px;
            margin: 0 auto;
        }
        .coming-soon {
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            border: 1.5px solid var(--ink);
            border-radius: 12px;
            padding: 8px 22px;
            line-height: 1.35;
            margin-top: 20px;
        }
        .coming-soon .small { font-size: 11px; color: var(--muted); }
        .coming-soon .big { font-weight: 700; font-size: 16px; }
        .cards {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px 60px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .card:focus-visible {
            outline: 2px solid #e8481c;
            outline-offset: 2px;
        }
        @media (prefers-reduced-motion: reduce) {
            .card { transition: none; }
            .card:hover { transform: none; }
        }
        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .card-icon.orange { background: var(--icon-orange); }
        .card-icon.blue { background: var(--icon-blue); }
        .card-icon.green { background: var(--icon-green); }
        .card-icon.purple { background: var(--icon-purple); }
        .card-body h3 {
            font-size: 16px;
            font-weight: 600;
        }
        .card-body p {
            font-size: 13px;
            color: var(--muted);
            margin-top: 2px;
        }
        .card-arrow {
            margin-left: auto;
            color: var(--arrow);
            font-size: 18px;
            flex-shrink: 0;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--line);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>training-log</h1>
        <p>仲間と、ゆるく、続ける筋トレログ</p>
    </div>

    <div class="hero">
        <div class="hero-icon">
            <img src="app_icon.png" alt="training-log アイコン">
        </div>
        <h2>サポートページ</h2>
        <p>training-log に関する各種情報をご確認いただけます</p>
        <div>
            <span class="coming-soon">
                <span class="small">App Store</span>
                <span class="big">近日公開</span>
            </span>
        </div>
    </div>

    <div class="cards">
        <a href="support.html" class="card">
            <div class="card-icon purple">💬</div>
            <div class="card-body">
                <h3>サポート・お問い合わせ</h3>
                <p>ご質問・ご要望・不具合報告</p>
            </div>
            <span class="card-arrow">›</span>
        </a>
        <a href="terms.html" class="card">
            <div class="card-icon blue">📋</div>
            <div class="card-body">
                <h3>利用規約</h3>
                <p>サービスのご利用に関する規約</p>
            </div>
            <span class="card-arrow">›</span>
        </a>
        <a href="privacy.html" class="card">
            <div class="card-icon green">🔒</div>
            <div class="card-body">
                <h3>プライバシーポリシー</h3>
                <p>個人情報の取り扱いについて</p>
            </div>
            <span class="card-arrow">›</span>
        </a>
    </div>

    <footer>
        &copy; 2026 training-log
    </footer>
</body>
</html>
